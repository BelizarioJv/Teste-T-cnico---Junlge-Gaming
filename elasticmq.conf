include classpath("application.conf")

rest-sqs {
  enabled = true
  bind = "0.0.0.0"
  port = 9324
}

queues {
  "wager-transactions.fifo" {
    fifo = true
    contentBasedDeduplication = true

    deadLettersQueue {
      name = "wager-transactions-dlq.fifo"
      maxReceiveCount = 3
    }
  }

  "wager-transactions-dlq.fifo" {
    fifo = true
  }
}