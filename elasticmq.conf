include classpath("application.conf")

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  # Entrada: comandos de aposta. MessageGroupId = walletId (ordem por carteira).
  "wager-transactions.fifo" {
    fifo = true
    contentBasedDeduplication = true
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 10 seconds

    # Redrive: após 3 recebimentos sem DeleteMessage a mensagem vai para a DLQ.
    # Deve ser igual a SQS_MAX_RECEIVE_COUNT.
    deadLettersQueue {
      name = "wager-transactions-dlq.fifo"
      maxReceiveCount = 3
    }
  }

  "wager-transactions-dlq.fifo" {
    fifo = true
    contentBasedDeduplication = true
  }

  # Saída: eventos publicados pelo Outbox.
  "wallet-events.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 30 seconds

    deadLettersQueue {
      name = "wallet-events-dlq.fifo"
      maxReceiveCount = 5
    }
  }

  "wallet-events-dlq.fifo" {
    fifo = true
    contentBasedDeduplication = true
  }
}
